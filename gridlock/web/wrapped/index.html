<!doctype html>
<html lang="en">

    <title>Grid Wrapped | GridLock</title>
    <link rel="stylesheet" href="./wrapped.css" />
  </head>
  <body>
    <div class="ambient-grid" aria-hidden="true"></div>
    <main class="wrapped-shell">
      <header class="wrapped-nav">

          <span class="brand-mark">GL</span>
